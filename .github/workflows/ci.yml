name: ETL CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test ETL
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify local env file is not tracked
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo ".env must not be committed"
            exit 1
          fi

      - name: Verify application package import
        run: |
          python -c "import etl_visitas; print('etl_visitas import OK')"

      - name: Compile Python source
        run: |
          python -m compileall src dags tests

      - name: Run unit tests
        run: |
          pytest -v tests/unit